[extend]
useDefault = true
# Two documented placeholder keys used only by tests — not secrets. Both are
# allowlisted as EXACT literals, so the rules and the files they appear in stay
# fully scanned; anything else in them still fails the job.
#
# - 0123456789abcdef: config-format parse test + a KAT constant.
# - the 64-hex SQLCipher fixture key below: opens the synthetic Signal DB that
#   `mint_signal_db` builds in-code at test time. Every occurrence sits behind
#   `cfg(test)` (core/src/keys.rs, core/src/store.rs, forensic/src/analyze.rs)
#   or in a test crate (core/tests/differential_sqlcipher.rs), and it is
#   documented as ground truth in tests/data/README.md. It opens no real
#   database and authenticates to no service — the byte pattern is a counted
#   ramp repeated twice.
[allowlist]
description = "Documented test placeholder keys, allowlisted by exact literal"
regexes = [
  '''0123456789abcdef''',
  '''00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff''',
]
